<div class="form-container">
  <h3>{{updateState() ? 'update post' : 'create post'}}</h3>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" enctype="multipart/form-data" class="post-form">

    <div class="form-group">
      <label for="post-title">Title</label>
      <input id="post-title" type="text" formControlName="title" placeholder="Title"
        [class.input--error]="form.controls.title.invalid && form.controls.title.touched" />
      <small class="form-error" *ngIf="form.controls.title.invalid && form.controls.title.touched">
        Title is required
      </small>
    </div>

    <div class="form-group">
      <label for="post-content">Content</label>
      <textarea id="post-content" formControlName="content" placeholder="Content" rows="5"
        [class.input--error]="form.controls.content.invalid && form.controls.content.touched"></textarea>
      <small class="form-error" *ngIf="form.controls.content.invalid && form.controls.content.touched">
        Content is required
      </small>
    </div>

    <div class="form-group">
      <label for="media-type">Media Type</label>
      <select id="media-type" formControlName="mediaType">
        <option value="">Select media type (optional)</option>
        <option value="image">Image</option>
        <option value="video">Video</option>
      </select>
    </div>

    <div class="form-group">
      <label for="file-upload">Upload File</label>
      <input id="file-upload" type="file" (change)="onFileSelected($event)" />
      <span *ngIf="fileName">{{ fileName }}</span>
    </div>

    <button type="submit" class="btn btn--primary" [disabled]="form.invalid || isSubmitting">
      {{ isSubmitting ? 'Creating...' : (updateState() ? 'Update Post' : 'Create Post') }}
    </button>

  </form>
</div>
