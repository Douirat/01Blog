<h1>Dashboard</h1>
<div *ngIf="currentUser as user">
  <app-post-form></app-post-form>
</div>
<hr />

<div *ngFor="let post of posts" class="post-card">
  <img class="card-image" *ngIf="post.mediaUrl" [src]="post.mediaUrl" alt="Post media">
  <div class="post-content">
    <span>By {{ post.user.nickName }}</span>
    <h3>{{ post.title }}</h3>
    <p>{{ post.content }}</p>
    <button (click)="toggleCommentForm(post.id)">comments</button> <small> <button>like</button> {{ post.likes
      }}</small>
    <small> <button>dislike</button> {{ post.dislikes }}</small>
    <app-comment-form *ngIf="showCommentForm(post.id)" [postId]="post.id"></app-comment-form>
    <app-post-comments *ngIf="showCommentForm(post.id)" [postId]="post.id"></app-post-comments>
  </div>
</div>

<button *ngIf="!lastPage" (click)="loadPosts()">Load More</button>
