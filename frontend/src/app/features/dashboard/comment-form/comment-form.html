<div class="form-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="title">Title</label>
      <input id="title" type="text" formControlName="title" placeholder="Title"
        [class.input--error]="form.controls.title.invalid && form.controls.title.touched" />
      <small class="form-error" *ngIf="form.controls.title.touched">
        <ng-container *ngIf="form.controls.title.errors?.['required']">Title is required.</ng-container>
        <ng-container *ngIf="form.controls.title.errors?.['minlength']">Title is too short.</ng-container>
        <ng-container *ngIf="form.controls.title.errors?.['maxlength']">Title is too long.</ng-container>
      </small>
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" formControlName="content" placeholder="Content" rows="5"
        [class.input--error]="form.controls.content.invalid && form.controls.content.touched"></textarea>
      <small class="form-error" *ngIf="form.controls.content.touched">
        <ng-container *ngIf="form.controls.content.errors?.['required']">Content is required.</ng-container>
        <ng-container *ngIf="form.controls.content.errors?.['minlength']">Content is too short.</ng-container>
        <ng-container *ngIf="form.controls.content.errors?.['maxlength']">Content is too long.</ng-container>
      </small>
    </div>

    <button type="submit" class="btn btn--primary" [disabled]="isLoading">
      {{ isLoading ? 'Submitting...' : 'Submit' }}
    </button>

    <div class="form-message form-message--error" *ngIf="isSuccess === false">
      Failed to create comment. Please try again.
    </div>

    <div class="form-message form-message--success" *ngIf="isSuccess === true">
      Comment was created successfully.
    </div>

  </form>
</div>
