<div class="form-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="title">Title</label>
      <input id="title" type="text" formControlName="title" placeholder="Title"
        [class.error]="form.controls.title.invalid && form.controls.title.touched" />
      <span class="error" *ngIf="form.controls.title.invalid && form.controls.title.touched">
        Title is required
      </span>
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" formControlName="content" placeholder="Content" rows="5"
        [class.error]="form.controls.content.invalid && form.controls.content.touched"></textarea>
      <span class="error" *ngIf="form.controls.content.invalid && form.controls.content.touched">
        Content is required
      </span>
    </div>

    <button type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Submitting...' : 'Submit' }}
    </button>

    <div class="error-message" *ngIf="isSuccess === false">
      Failed to create comment. Please try again.
    </div>

    <div class="success-message" *ngIf="isSuccess === true">
      Comment was created successfully.
    </div>
  </form>
</div>
