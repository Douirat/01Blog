<div class="form-container">
  <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">

    <h2>Report Post</h2>

    <!-- The reason is obvious -->
    <div class="form-group">
      <label for="reason">Reason</label>
      <select id="reason" formControlName="reason"
        [class.input--error]="reportForm.controls.reason.invalid && reportForm.controls.reason.touched">
        <option value="">Select a reason</option>
        <option value="spam">Spam</option>
        <option value="inappropriate">Inappropriate content</option>
        <option value="harassment">Harassment</option>
        <option value="other">Other</option>
      </select>
      <small class="form-error"
        *ngIf="reportForm.controls.reason.invalid && reportForm.controls.reason.touched">
        Reason is required
      </small>
    </div>

    <!-- In case the reason was different -->
    <div class="form-group" *ngIf="reportForm.get('reason')?.value === 'other'">
      <label for="details">Details</label>
      <textarea id="details" formControlName="details"
        placeholder="Provide additional details..."
        [class.input--error]="reportForm.controls.details.invalid && reportForm.controls.details.touched">
      </textarea>
      <small class="form-error"
        *ngIf="reportForm.controls.details.invalid && reportForm.controls.details.touched">
        Details are required
      </small>
    </div>

    <!-- The submit button -->
    <button type="submit" class="btn btn--primary" [disabled]="reportForm.invalid">
      Submit Report
    </button>

  </form>
</div>
