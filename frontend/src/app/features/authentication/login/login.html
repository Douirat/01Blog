<div class="form-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <!-- Email or Username -->
    <div class="form-group">
      <label for="emailOrUsername">Email or Username</label>
      <input
        id="emailOrUsername"
        type="text"
        formControlName="emailOrUsername"
        placeholder="Enter your email or username"
        [class.input--error]="hasError('emailOrUsername', 'required') || hasError('emailOrUsername', 'minlength') || hasError('emailOrUsername', 'maxlength') || hasError('emailOrUsername', 'invalidFormat')"
      />
      <small class="form-error" *ngIf="hasError('emailOrUsername', 'required')">
        Email or username is required
      </small>
      <small class="form-error" *ngIf="hasError('emailOrUsername', 'minlength')">
        Must be at least 3 characters
      </small>
      <small class="form-error" *ngIf="hasError('emailOrUsername', 'maxlength')">
        Must be at most 254 characters
      </small>
      <small class="form-error" *ngIf="hasError('emailOrUsername', 'invalidFormat')">
        Must be a valid email or username (letters/numbers/_)
      </small>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Enter your password"
        [class.input--error]="hasError('password', 'required') || hasError('password', 'minlength') || hasError('password', 'maxlength')"
      />
      <small class="form-error" *ngIf="hasError('password', 'required')">
        Password is required
      </small>
      <small class="form-error" *ngIf="hasError('password', 'minlength')">
        Password must be at least 8 characters
      </small>
      <small class="form-error" *ngIf="hasError('password', 'maxlength')">
        Password must be at most 128 characters
      </small>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn--primary" [disabled]="isSubmitting || form.invalid">
      <span *ngIf="isSubmitting">Submitting...</span>
      <span *ngIf="!isSubmitting">Login</span>
    </button>

  </form>
</div>
