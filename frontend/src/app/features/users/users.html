<div class="container">
    <!-- Pass the current 'user' object to the visiteProfile method -->
    <div (click)="visiteProfile(user)" class="user-card" *ngFor="let user of users()">
        <img class="profile-image" *ngIf="user.avatar" [src]="user.avatar" alt="user-avatar">
        <p>{{ user.firstName }} {{ user.lastName }}</p>
    </div>
</div>
