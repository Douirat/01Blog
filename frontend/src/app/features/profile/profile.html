<div *ngIf="user()">
  <img [src]="user()?.avatar" alt="Avatar">
  <h2>{{ user()?.firstName }} {{ user()?.lastName }}</h2>
  <p>{{ user()?.email }}</p>
</div>
<div *ngFor="let post of posts()" class="post-card">
  <img class="card-image" *ngIf="post.mediaUrl" [src]="post.mediaUrl" alt="Post media">
  <div class="post-content">
    <span>By {{ post.user.nickName }}</span>
    <h3>{{ post.title }}</h3>
    <p>{{ post.content }}</p>
    <button (click)="toggleUpdate(post.id)">update</button>
    <app-post-form [postToUpdate]="post" *ngIf="postToUpdate() === post.id"></app-post-form>
    <hr>
  </div>
