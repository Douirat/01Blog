<div *ngIf="user()">
  <img style="width: 200px; height: auto;" [src]="user()?.avatar" alt="Avatar">
  <h2>{{ user()?.firstName }} {{ user()?.lastName }}</h2>
  <p>{{ user()?.email }}</p>
</div>
<div *ngFor="let post of posts()" class="post-card">
  <img style="width: 200px; height: auto;" class="card-image" *ngIf="post.mediaUrl" [src]="post.mediaUrl" alt="Post media">
  <div class="post-content">
    <span>By {{ post.user.nickName }}</span>
    <h3>{{ post.title }}</h3>
    <p>{{ post.content }}</p>
    <div class="actions">
  <!-- Update button -->
  <button *ngIf="profileOwner()" (click)="toggleUpdate(+post.id)">
    ✏️ Update
  </button>

  <!-- Delete button -->
  <button *ngIf="profileOwner()" (click)="deletePost(+post.id)">
    🗑️ Delete
  </button>
</div>
    <app-post-form [postToUpdate]="post" *ngIf="postToUpdate() === post.id" (postSaved)="onPostUpdated($event)"></app-post-form>
    <hr>
  </div>
