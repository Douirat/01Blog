<nav class="header">
  <!--Not logged in-->
  <ng-container *ngIf="!isLoggedIn()">

    <div class="first-nav-section">
      <a class="clickable link" routerLink="/" (click)="goHome()">01 Blog</a>
    </div>

    <div class="second-nav-section">
      <a class="clickable link" routerLink="/login" (click)="login()">Login</a>
      <a class="clickable link" routerLink="/register" (click)="register()">Register</a>
    </div>
  </ng-container>

  <!--Logged in-->
  <ng-container *ngIf="isLoggedIn()">
    <div class="first-nav-section">
      <a class="clickable link" routerLink="/" (click)="goHome()">01 Blog</a>
      <a class="clickable link" (click)="goToUsersOrReports()">
        {{ isAdmin() ? ('reports: ' + reportsNumber()) : 'users' }}
      </a>
    </div>
    <div class="second-nav-section">
      <a class="clickable link" (click)="goToProfile()">Profile <span>{{ user()?.user?.nickname }}
        </span></a>
      <button class="logout-btn" (click)="logout()"></button>
    </div>
  </ng-container>
</nav>
